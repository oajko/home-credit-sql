[project]
name = "credit-data-analysis"
version = "0.1.0"
description = "SQL with Home Credit Data"
readme = "README.md"
authors = [
    { name = "oajko" }
]
requires-python = ">=3.12.13"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[project.scripts]
credit-data-analysis = "credit_data_analysis:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
